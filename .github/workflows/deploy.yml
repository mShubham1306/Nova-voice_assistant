name: CI — Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Python Backend Tests
  # Uses requirements-ci.txt — pure Python only, no audio/GUI system libraries.
  # All audio/TTS imports have try/except fallbacks so tests pass without them.
  # ─────────────────────────────────────────────────────────────────────────────
  backend-tests:
    name: 🐍 Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Run NOVA 3.0 Enterprise Tests
        run: python backend/tests/test_v3.py

      - name: Run Backend Verification Tests
        run: python backend/tests/test_backend.py

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Frontend Build
  # Verifies Vite + React compiles cleanly with Node 20 (Vite 8 requirement).
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: ⚛️ Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Report bundle size
        working-directory: frontend
        run: |
          echo "📦 Build output:"
          ls -lh dist/assets/

# ─────────────────────────────────────────────────────────────────────────────
# DEPLOYMENT NOTE:
# ✅ Vercel auto-deploys on every push to main via its GitHub Integration.
#    No VERCEL_TOKEN needed in CI. Configure at: https://vercel.com/dashboard
# ✅ Railway auto-deploys on every push to main via its GitHub Integration.
#    No RAILWAY_TOKEN needed in CI. Configure at: https://railway.app/dashboard
# ─────────────────────────────────────────────────────────────────────────────
