services:
  - type: web
    name: nova-voice-assistant-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # Set manually in Render dashboard
      - key: SECRET_KEY
        generateValue: true  # Auto-generated by Render
      - key: DEBUG
        value: "False"
      - key: ASSISTANT_NAME
        value: "Nova"
