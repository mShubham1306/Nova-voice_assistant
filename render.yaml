services:
  - type: web
    name: nova-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: yes
    pullRequestPreviewsEnabled: no
    numInstances: 1
    envVars:
      # ── CRITICAL — Set these manually in Render Dashboard ──────────────────
      - key: GEMINI_API_KEY
        sync: false
        description: "REQUIRED: Your Google Gemini API key from aistudio.google.com"

      - key: SECRET_KEY
        generateValue: true
        description: "Auto-generated by Render — do NOT edit"

      - key: CORS_ORIGINS
        sync: false
        description: "Set AFTER Vercel deploy: e.g. https://nova-xyz.vercel.app"

      # ── SERVER ──────────────────────────────────────────────────────────────
      - key: ENVIRONMENT
        value: "production"
      - key: DEBUG
        value: "False"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "10000"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONPATH
        value: "/app/backend"

      # ── IDENTITY ────────────────────────────────────────────────────────────
      - key: ASSISTANT_NAME
        value: "Nova"
      - key: WAKE_WORD
        value: "hey nova"

      # ── AI / GEMINI ──────────────────────────────────────────────────────────
      - key: GEMINI_MODEL
        value: "gemini-2.0-flash"
      - key: GEMINI_MAX_TOKENS
        value: "512"

      # ── VOICE ENGINE ─────────────────────────────────────────────────────────
      - key: VOICE_RATE
        value: "180"
      - key: VOICE_GENDER
        value: "female"
      - key: LISTEN_TIMEOUT
        value: "5"
      - key: PHRASE_TIME_LIMIT
        value: "8"
      - key: LANGUAGE
        value: "en-in"
